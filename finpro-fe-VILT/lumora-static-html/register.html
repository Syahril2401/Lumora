<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register – Lumora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['DM Sans','sans-serif']}}}}</script>
<style>::selection{background:#c7d2fe;color:#1E1B4B}</style>
</head>
<body class="min-h-screen bg-[#F0F2F9] flex flex-col items-center justify-center px-4 relative overflow-hidden font-sans py-20">
<div class="absolute top-[-10%] left-[-5%] w-[500px] h-[500px] bg-indigo-200/30 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[400px] h-[400px] bg-purple-200/30 rounded-full blur-[100px]"></div>

<div class="relative z-10 w-full max-w-[500px] flex flex-col items-center">
  <div class="text-center mb-10">
    <a href="landing.html" class="flex items-center justify-center gap-3 mb-4">
      <div class="w-10 h-10 bg-[#3D3ACE] rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200">
        <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
      </div>
      <span class="text-2xl font-black text-[#1E1B4B] tracking-tight">Lumora</span>
    </a>
    <p class="text-slate-500 font-medium">Create your account to start your journey.</p>
  </div>

  <div class="w-full bg-white rounded-[40px] p-10 md:p-12 shadow-2xl shadow-indigo-100 border border-white/50">
    <form onsubmit="handleRegister(event)" class="space-y-6">
      <div class="space-y-3">
        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Full Name</label>
        <input id="regName" type="text" placeholder="Enter your name" class="w-full bg-[#F3F4F6] border-transparent focus:bg-white focus:border-[#3D3ACE] focus:ring-4 focus:ring-indigo-100 rounded-2xl py-4 px-6 text-slate-700 font-medium transition-all duration-300" required>
      </div>
      <div class="space-y-3">
        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Email Address</label>
        <input id="regEmail" type="email" placeholder="example@lumora.edu" class="w-full bg-[#F3F4F6] border-transparent focus:bg-white focus:border-[#3D3ACE] focus:ring-4 focus:ring-indigo-100 rounded-2xl py-4 px-6 text-slate-700 font-medium transition-all duration-300" required>
      </div>
      <div class="space-y-3">
        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Password</label>
        <div class="relative group">
          <span class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg></span>
          <input id="regPassword" type="password" placeholder="Create a password" class="w-full bg-[#F3F4F6] border-transparent focus:bg-white focus:border-[#3D3ACE] focus:ring-4 focus:ring-indigo-100 rounded-2xl py-4 pl-14 pr-6 text-slate-700 font-medium transition-all duration-300" required>
        </div>
      </div>
      <div class="space-y-3">
        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest ml-1">Confirm Password</label>
        <div class="relative group">
          <span class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg></span>
          <input id="regPasswordConfirm" type="password" placeholder="Repeat your password" class="w-full bg-[#F3F4F6] border-transparent focus:bg-white focus:border-[#3D3ACE] focus:ring-4 focus:ring-indigo-100 rounded-2xl py-4 pl-14 pr-6 text-slate-700 font-medium transition-all duration-300" required>
        </div>
      </div>
      <p class="text-center text-xs text-slate-400 leading-relaxed px-4">By registering, you agree to our <a href="#" class="text-[#3D3ACE] font-bold hover:underline">Terms of Service</a> and <a href="#" class="text-[#3D3ACE] font-bold hover:underline">Privacy Policy</a>.</p>
      <button type="submit" id="regBtn" class="w-full bg-[#3D3ACE] hover:bg-[#322fb0] text-white font-bold py-5 rounded-2xl shadow-xl shadow-indigo-100 transition-all duration-300 transform active:scale-[0.98] disabled:opacity-70">
        <span id="regText">Register</span>
      </button>
    </form>
    <p class="text-center mt-10 text-[15px] font-medium text-slate-500">Already have an account? <a href="login.html" class="text-[#3D3ACE] font-bold hover:underline">Login</a></p>
  </div>
  <div class="mt-12 opacity-20">
    <svg class="w-16 h-16 text-[#3D3ACE]" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
  </div>
</div>

<script>
function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('regBtn');
  const text = document.getElementById('regText');
  const pw = document.getElementById('regPassword').value;
  const pw2 = document.getElementById('regPasswordConfirm').value;
  if (pw !== pw2) { alert('Passwords do not match!'); return; }
  btn.disabled = true; text.textContent = 'Creating account...';
  setTimeout(() => { window.location.href = 'onboarding-sanctuary.html'; }, 1200);
}
</script>
</body>
</html>
