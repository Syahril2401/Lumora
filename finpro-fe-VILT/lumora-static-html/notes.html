<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Notes – Lumora</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">

<script>tailwind.config={theme:{extend:{fontFamily:{sans:['DM Sans','sans-serif']}}}}</script>

</head>
<body class="h-screen bg-[#FDFDFF] font-sans text-slate-900 flex overflow-hidden">
<!-- Sidebar -->
<aside class="bg-[#0B1120] border-[#1E293B] flex flex-col z-40 relative shadow-xl w-64 border-r">
  <div class="p-6 pb-6 flex items-center gap-3"><div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-900/50"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg></div><div><span class="text-lg font-black text-white tracking-tight block">Lumora</span><span class="text-[10px] font-black text-indigo-300 uppercase tracking-widest bg-indigo-900/50 px-2 py-0.5 rounded-md">Intelligent Sanctuary</span></div></div>
  <nav class="flex-1 px-4 py-2 space-y-1.5 overflow-y-auto scrollbar-hide">
    <a href="dashboard.html" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-sm font-bold text-slate-400 hover:bg-white/5 hover:text-slate-200"><svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>Dashboard</a>
    <a href="planner.html" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-sm font-bold text-slate-400 hover:bg-white/5 hover:text-slate-200"><svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>Planner</a>
    <a href="weekly-targets.html" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-sm font-bold text-slate-400 hover:bg-white/5 hover:text-slate-200"><svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Weekly Targets</a>
    <a href="notes.html" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-sm font-bold bg-indigo-600 text-white shadow-lg shadow-indigo-900/20"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>Notes</a>
    <a href="progress.html" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-sm font-bold text-slate-400 hover:bg-white/5 hover:text-slate-200"><svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>Progress</a>
    <a href="settings.html" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-sm font-bold text-slate-400 hover:bg-white/5 hover:text-slate-200"><svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg>Settings</a>
  </nav>
  <div class="px-4 pb-6 mt-auto space-y-4"><a href="login.html" class="flex items-center gap-3 text-sm font-bold text-slate-400 hover:text-slate-100 hover:bg-white/5 transition-all py-2.5 px-3 rounded-xl w-full text-left"><svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>Logout</a><div class="border-t border-[#1E293B] pt-4"><div class="p-2 rounded-xl flex items-center gap-3"><div class="w-9 h-9 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 p-0.5"><div class="w-full h-full rounded-full bg-slate-600 flex items-center justify-center text-white text-xs font-bold">PS</div></div><div class="flex-1 min-w-0"><p class="text-xs font-black text-white truncate">Pamungkas</p><p class="text-[9px] font-bold text-indigo-400 uppercase tracking-wider truncate">Deep Focus Mode</p></div></div></div></div>
</aside>
<!-- Main -->
<main class="flex-1 flex flex-col relative">
  <header class="h-20 px-10 flex items-center justify-between bg-[#F7F9FB] z-30 shrink-0 border-b border-slate-200"><div class="flex-1"><button class="p-2 -ml-2 rounded-xl text-slate-500 hover:bg-slate-200/60 hover:text-slate-800 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg></button></div><div class="flex items-center gap-6"><button class="text-slate-500 hover:text-slate-800 transition-colors relative"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg><div class="absolute -top-1.5 -right-1.5 w-4 h-4 bg-red-500 text-white text-[8px] font-black rounded-full flex items-center justify-center">3</div></button><button class="text-slate-500 hover:text-slate-800 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg></button><div class="h-6 w-px bg-slate-300"></div><div class="flex items-center gap-3"><span class="text-xs font-black text-slate-900">Pamungkas</span><div class="w-8 h-8 rounded-full bg-slate-300 flex items-center justify-center text-white text-xs font-bold">PS</div></div></div></header>

  <div class="flex h-[calc(100vh-5rem)] overflow-hidden rounded-[32px] shadow-sm border bg-[#F7F9FB] border-slate-200 m-4 mt-0">
    <!-- Notes Sidebar -->
    <div class="w-72 bg-white border-r border-slate-200 flex flex-col shrink-0">
      <div class="p-4 border-b border-slate-100">
        <button onclick="openTemplatePicker()" class="w-full bg-[#3D3ACE] hover:bg-[#312E81] text-white py-3 rounded-xl text-sm font-bold shadow-md shadow-indigo-200 transition-all flex items-center justify-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"/></svg>New Note</button>
      </div>
      <div class="p-3"><input id="searchNotes" oninput="filterNotes()" type="text" placeholder="Search notes..." class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-sm font-medium text-slate-700 focus:border-[#3D3ACE] outline-none transition-all"></div>
      <div class="px-3 pb-2"><select id="dimFilter" onchange="filterNotes()" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-xs font-bold text-slate-600 focus:border-[#3D3ACE] outline-none"><option value="all">All Dimensions</option><option value="Planning">Planning</option><option value="Cognitive Strategy">Cognitive Strategy</option><option value="Reflection">Reflection</option></select></div>
      <div id="notesList" class="flex-1 overflow-y-auto scrollbar-hide p-2 space-y-1"></div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col p-6 overflow-y-auto gap-6 bg-[#F7F9FB]" id="notesMain">
      <!-- Recently Edited (when no note selected) -->
      <div id="recentView">
        <div class="flex items-center justify-between mb-4"><div><h2 class="text-xl font-black tracking-tight text-slate-900">Recently Edited</h2><p class="text-sm font-medium mt-1 text-slate-500">Pick up right where you left off</p></div><span class="text-sm font-bold flex items-center gap-1 text-slate-600 hover:text-slate-900 cursor-pointer">View History <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></span></div>
        <div class="grid grid-cols-3 gap-4" id="recentGrid"></div>
      </div>

      <!-- Editor (when note selected) -->
      <div id="editorView" class="hidden flex-1 flex flex-col">
        <div class="bg-white rounded-[32px] border border-slate-200 shadow-sm flex flex-col overflow-hidden flex-1">
          <div class="h-16 border-b border-slate-100 flex items-center justify-between px-6 bg-white shrink-0 z-10">
            <div class="flex items-center gap-1 text-slate-500 overflow-x-auto scrollbar-hide">
              <button class="p-1.5 hover:bg-slate-100 rounded transition-colors" title="Undo"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg></button>
              <button class="p-1.5 hover:bg-slate-100 rounded transition-colors mr-2" title="Redo"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10h-10a8 8 0 00-8 8v2M21 10l-6 6m6-6l-6-6"/></svg></button>
              <div class="w-px h-5 bg-slate-200 mx-1"></div>
              <button class="p-1.5 hover:bg-slate-100 rounded transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg></button>
              <button class="p-1.5 hover:bg-slate-100 rounded transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h2m0 0v14m0-14h2M13 5h2m0 0v14m0-14h2M5 12h10"/></svg></button>
              <button class="p-1.5 hover:bg-slate-100 rounded transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" stroke-dasharray="2 4"/></svg></button>
              <button class="p-1.5 hover:bg-slate-100 rounded transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 6h13M7 12h13M7 18h13M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
              <button class="p-1.5 hover:bg-slate-100 rounded transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></button>
              <button class="p-1.5 hover:bg-slate-100 rounded transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg></button>
              <button class="p-1.5 hover:bg-slate-100 rounded transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/></svg></button>
              <div class="w-px h-5 bg-slate-200 mx-1"></div>
              <button class="p-1.5 hover:bg-slate-100 rounded transition-colors text-indigo-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></button>
              <button class="p-1.5 hover:bg-slate-100 rounded transition-colors text-yellow-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg></button>
              <button class="p-1.5 hover:bg-slate-100 rounded transition-colors text-rose-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></button>
            </div>
            <div class="flex items-center gap-2">
              <div class="text-[10px] font-black uppercase tracking-widest flex items-center gap-1.5 mr-2 text-emerald-500"><span class="w-1.5 h-1.5 rounded-full animate-pulse bg-emerald-500"></span><span class="hidden sm:inline">Saved</span></div>
              <button onclick="confirmDelete()" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors" title="Delete"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
              <button onclick="window.print()" class="px-4 py-1.5 text-sm font-bold text-white bg-[#3D3ACE] hover:bg-[#312E81] shadow-sm shadow-indigo-200 rounded-lg transition-all flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>Export</button>
            </div>
          </div>
          <div class="flex-1 overflow-y-auto bg-white p-8 lg:px-16 scrollbar-hide">
            <div class="max-w-4xl mx-auto w-full">
              <input id="noteTitle" class="w-full text-4xl font-black text-[#1E1B4B] placeholder:text-slate-300 outline-none border-none focus:ring-0 p-0 mb-6 bg-transparent" placeholder="Untitled Note" oninput="autoSave()">
              <div id="blocksContainer" class="space-y-3"></div>
              <button onclick="addBlock()" class="mt-4 text-sm text-slate-400 hover:text-[#3D3ACE] font-bold flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg> Add block</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Template Picker Modal -->
<div id="templateModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-[24px] p-8 w-full max-w-2xl shadow-2xl border border-slate-100 max-h-[80vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-6"><h2 class="text-xl font-black text-slate-900">Choose a Template</h2><button onclick="closeTemplatePicker()" class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-50 text-slate-400 hover:bg-slate-100"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button></div>
    <div class="grid grid-cols-2 gap-4">
      <button onclick="createFromTemplate('blank')" class="p-6 rounded-2xl border-2 border-slate-100 hover:border-indigo-200 text-left transition-all group"><div class="w-10 h-10 bg-slate-50 rounded-xl flex items-center justify-center mb-3 group-hover:bg-indigo-50 transition-colors"><svg class="w-5 h-5 text-slate-400 group-hover:text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></div><h3 class="font-black text-slate-900">Blank Note</h3><p class="text-xs text-slate-500 mt-1">Start with a clean slate</p></button>
      <button onclick="createFromTemplate('daily')" class="p-6 rounded-2xl border-2 border-slate-100 hover:border-indigo-200 text-left transition-all group"><div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center mb-3 group-hover:bg-indigo-50 transition-colors"><svg class="w-5 h-5 text-blue-400 group-hover:text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></div><h3 class="font-black text-slate-900">Daily Reflection</h3><p class="text-xs text-slate-500 mt-1">Track your daily learning</p></button>
      <button onclick="createFromTemplate('session')" class="p-6 rounded-2xl border-2 border-slate-100 hover:border-indigo-200 text-left transition-all group"><div class="w-10 h-10 bg-emerald-50 rounded-xl flex items-center justify-center mb-3 group-hover:bg-indigo-50 transition-colors"><svg class="w-5 h-5 text-emerald-400 group-hover:text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div><h3 class="font-black text-slate-900">Study Session</h3><p class="text-xs text-slate-500 mt-1">Document a study session</p></button>
      <button onclick="createFromTemplate('weekly')" class="p-6 rounded-2xl border-2 border-slate-100 hover:border-indigo-200 text-left transition-all group"><div class="w-10 h-10 bg-purple-50 rounded-xl flex items-center justify-center mb-3 group-hover:bg-indigo-50 transition-colors"><svg class="w-5 h-5 text-purple-400 group-hover:text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7l3 3m0-3l-3 3"/></svg></div><h3 class="font-black text-slate-900">Weekly Review</h3><p class="text-xs text-slate-500 mt-1">Summarize your week</p></button>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div id="deleteModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden">
    <div class="p-6"><div class="w-12 h-12 bg-rose-100 rounded-full flex items-center justify-center text-rose-600 mb-4 mx-auto"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></div><h3 class="text-xl font-black text-center text-slate-900 mb-2">Delete Note?</h3><p class="text-slate-500 text-sm text-center mb-6">Are you sure? This action cannot be undone.</p><div class="flex gap-3"><button onclick="document.getElementById('deleteModal').classList.add('hidden')" class="flex-1 py-2.5 px-4 rounded-xl font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 transition-colors">Cancel</button><button onclick="doDelete()" class="flex-1 py-2.5 px-4 rounded-xl font-bold text-white bg-rose-500 hover:bg-rose-600 shadow-md shadow-rose-200 transition-colors">Delete</button></div></div>
  </div>
</div>

<script>
const notes = [
  { id:1, title:'Market Structures', content_text:'Key differences between perfect competition and monopolistic competition...', focus_dimension:'Cognitive Strategy', is_pinned:true, updated_at:'2024-06-05T10:30:00' },
  { id:2, title:'Elasticity Concepts', content_text:'Price elasticity of demand and supply curves analysis...', focus_dimension:'Planning', is_pinned:false, updated_at:'2024-06-05T09:15:00' },
  { id:3, title:'Game Theory Basics', content_text:'Nash equilibrium and dominant strategies...', focus_dimension:'Cognitive Strategy', is_pinned:false, updated_at:'2024-06-04T16:45:00' },
  { id:4, title:'Weekly Reflection', content_text:'This week I focused on microeconomics chapters 3-5...', focus_dimension:'Reflection', is_pinned:true, updated_at:'2024-06-03T20:00:00' },
  { id:5, title:'Supply Chain Notes', content_text:'Global supply chain dynamics and market impacts...', focus_dimension:'Planning', is_pinned:false, updated_at:'2024-06-02T14:30:00' },
];

let selectedNoteId = null;
let noteBlocks = [];

function renderNotesList() {
  const list = document.getElementById('notesList');
  const search = document.getElementById('searchNotes').value.toLowerCase();
  const dim = document.getElementById('dimFilter').value;
  const filtered = notes.filter(n => {
    if (search && !n.title.toLowerCase().includes(search) && !n.content_text.toLowerCase().includes(search)) return false;
    if (dim !== 'all' && n.focus_dimension !== dim) return false;
    return true;
  });
  const pinned = filtered.filter(n => n.is_pinned);
  const unpinned = filtered.filter(n => !n.is_pinned);
  let html = '';
  if (pinned.length) {
    html += '<p class="text-[9px] font-black text-slate-400 uppercase tracking-widest px-3 pt-2 pb-1">Pinned</p>';
    pinned.forEach(n => { html += noteItemHTML(n); });
  }
  if (unpinned.length) {
    html += '<p class="text-[9px] font-black text-slate-400 uppercase tracking-widest px-3 pt-2 pb-1">Recent</p>';
    unpinned.forEach(n => { html += noteItemHTML(n); });
  }
  list.innerHTML = html || '<p class="text-center text-xs text-slate-400 py-8">No notes found</p>';
}

function noteItemHTML(n) {
  const isActive = selectedNoteId === n.id;
  return `<div onclick="selectNote(${n.id})" class="p-3 rounded-xl cursor-pointer transition-all ${isActive?'bg-indigo-50 border border-indigo-100':'hover:bg-slate-50 border border-transparent'}">
    <div class="flex items-center justify-between mb-1"><span class="px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 text-[8px] font-black uppercase tracking-widest">${n.focus_dimension}</span>${n.is_pinned?'<svg class="w-3 h-3 text-amber-400" fill="currentColor" viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>':''}</div>
    <h4 class="text-sm font-black text-slate-900 truncate">${n.title}</h4>
    <p class="text-[10px] text-slate-400 truncate mt-0.5">${n.content_text}</p>
  </div>`;
}

function renderRecent() {
  const grid = document.getElementById('recentGrid');
  if (!notes.length) { grid.innerHTML = '<div class="col-span-3 text-slate-500 text-sm font-bold text-center mt-10">No recent notes. Create one to get started!</div>'; return; }
  const sorted = [...notes].sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
  const large = sorted[0];
  const small = sorted.slice(1, 3);
  let html = '';
  if (small.length) {
    html += '<div class="col-span-1 flex flex-col gap-4">';
    small.forEach(n => {
      html += `<div onclick="selectNote(${n.id})" class="flex-1 bg-white rounded-2xl p-4 border border-slate-200 shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group cursor-pointer"><div class="flex items-center justify-between mb-2"><span class="px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 text-[9px] font-black uppercase tracking-widest border border-blue-100">${n.focus_dimension}</span></div><h3 class="text-sm font-black text-slate-900 leading-snug group-hover:text-indigo-600 transition-colors">${n.title}</h3><p class="text-xs text-slate-500 mt-1 line-clamp-2">${n.content_text}</p></div>`;
    });
    html += '</div>';
  }
  if (large) {
    html += `<div onclick="selectNote(${large.id})" class="col-span-2 bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group cursor-pointer"><div class="flex items-center justify-between mb-4"><div class="flex gap-2"><span class="px-3 py-1 rounded-full bg-slate-100 text-slate-700 text-[10px] font-black uppercase tracking-widest border border-slate-200">${large.focus_dimension}</span></div><span class="text-[11px] font-bold text-slate-400">Recent</span></div><h3 class="text-xl font-black text-slate-900 mb-2 group-hover:text-indigo-600 transition-colors max-w-sm leading-tight">${large.title}</h3><p class="text-sm text-slate-500 max-w-md line-clamp-2 mb-4">${large.content_text}</p></div>`;
  }
  grid.innerHTML = html;
}

function selectNote(id) {
  selectedNoteId = id;
  const note = notes.find(n => n.id === id);
  if (!note) return;
  document.getElementById('recentView').classList.add('hidden');
  document.getElementById('editorView').classList.remove('hidden');
  document.getElementById('noteTitle').value = note.title;
  noteBlocks = [{ type:'paragraph', content: note.content_text }];
  renderBlocks();
  renderNotesList();
}

function renderBlocks() {
  const c = document.getElementById('blocksContainer');
  c.innerHTML = '';
  noteBlocks.forEach((b, i) => {
    const div = document.createElement('div');
    div.className = 'group flex items-start gap-2';
    div.innerHTML = `<button onclick="removeBlock(${i})" class="opacity-0 group-hover:opacity-100 mt-2 w-6 h-6 rounded text-slate-400 hover:text-rose-500 flex items-center justify-center transition-all"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
      <input class="flex-1 text-sm font-medium text-slate-700 bg-transparent border-none outline-none focus:ring-0 p-2 rounded-lg hover:bg-slate-50 focus:bg-slate-50 transition-colors" value="${b.content}" oninput="updateBlock(${i}, this.value)" placeholder="Type something...">`;
    c.appendChild(div);
  });
}

function addBlock() { noteBlocks.push({type:'paragraph',content:''}); renderBlocks(); autoSave(); }
function removeBlock(i) { noteBlocks.splice(i,1); renderBlocks(); autoSave(); }
function updateBlock(i, val) { noteBlocks[i].content = val; autoSave(); }

let saveTimeout;
function autoSave() {
  const status = document.querySelector('#editorView .text-emerald-500');
  if(status) { status.className = 'text-[10px] font-black uppercase tracking-widest flex items-center gap-1.5 mr-2 text-amber-500'; status.innerHTML = '<span class="w-1.5 h-1.5 rounded-full animate-pulse bg-amber-500"></span><span class="hidden sm:inline">Saving...</span>'; }
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    if(status) { status.className = 'text-[10px] font-black uppercase tracking-widest flex items-center gap-1.5 mr-2 text-emerald-500'; status.innerHTML = '<span class="w-1.5 h-1.5 rounded-full animate-pulse bg-emerald-500"></span><span class="hidden sm:inline">Saved</span>'; }
    if (selectedNoteId) {
      const note = notes.find(n=>n.id===selectedNoteId);
      if(note) { note.title = document.getElementById('noteTitle').value; note.content_text = noteBlocks.map(b=>b.content).join('\n'); }
      renderNotesList();
    }
  }, 800);
}

function openTemplatePicker() { document.getElementById('templateModal').classList.remove('hidden'); }
function closeTemplatePicker() { document.getElementById('templateModal').classList.add('hidden'); }
function createFromTemplate(tpl) {
  closeTemplatePicker();
  const titles = { blank:'Untitled', daily:'Daily Reflection', session:'Study Session', weekly:'Weekly Review' };
  const newNote = { id:Date.now(), title:titles[tpl]||'Untitled', content_text:'', focus_dimension:'General', is_pinned:false, updated_at:new Date().toISOString() };
  notes.unshift(newNote);
  renderNotesList();
  selectNote(newNote.id);
}

function confirmDelete() { if(selectedNoteId) document.getElementById('deleteModal').classList.remove('hidden'); }
function doDelete() {
  if(selectedNoteId) { notes.splice(notes.findIndex(n=>n.id===selectedNoteId),1); selectedNoteId=null; }
  document.getElementById('deleteModal').classList.add('hidden');
  document.getElementById('editorView').classList.add('hidden');
  document.getElementById('recentView').classList.remove('hidden');
  renderNotesList(); renderRecent();
}

function filterNotes() { renderNotesList(); }

renderNotesList();
renderRecent();
</script>
</body>
</html>
